name: supplypilot-sp903-local-demo

services:
  mysql:
    ports: !override
      - "127.0.0.1:${DEMO_MYSQL_HOST_PORT:-13307}:3306"
    environment:
      MYSQL_DATABASE: supplypilot_demo
    volumes:
      - sp903-mysql-data:/var/lib/mysql

  pgvector:
    environment:
      POSTGRES_DB: supplypilot_semantic_demo
    volumes:
      - sp903-pgvector-data:/var/lib/postgresql/data

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mysql://mysql:3306/supplypilot_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SEMANTIC_DB_URL: jdbc:postgresql://pgvector:5432/supplypilot_semantic_demo
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:${DEMO_FRONTEND_PORT:-8081}}
      DOCUMENT_STORAGE_PATH: /app/data/demo-documents
      DEMO_ACCOUNT_PASSWORD: ${DEMO_ACCOUNT_PASSWORD:?Set DEMO_ACCOUNT_PASSWORD in .env.demo}
      DEMO_DATASET_VERSION: ${DEMO_DATASET_VERSION:-sp-905-zh-tw-v1}
      DEMO_SAMPLES_PATH: /app/samples/demo-documents
      DEMO_ALLOWED_DATABASE: supplypilot_demo
      DEMO_ALLOWED_SEMANTIC_DATABASE: supplypilot_semantic_demo
    volumes: !override
      - sp903-document-storage:/app/data/demo-documents
      - ./samples/documents:/app/samples/demo-documents:ro

  frontend:
    ports: !override
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-8081}:8080"

volumes:
  sp903-mysql-data:
    name: supplypilot-sp903-local-demo-mysql
  sp903-pgvector-data:
    name: supplypilot-sp903-local-demo-pgvector
  sp903-document-storage:
    name: supplypilot-sp903-local-demo-documents
