name: CI Merge Gate

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine impacted pipelines
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          # PRs and main always run both suites, regardless of changed files.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ || "$base" == "0000000000000000000000000000000000000000" ]]; then
            # First push of a newly created branch: compare with main.
            git fetch --no-tags origin main
            base="$(git merge-base HEAD origin/main)"
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # Unknown previous commit: fail safe and run both suites.
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          backend=false
          frontend=false
          while IFS= read -r path; do
            case "$path" in
              backend/*)
                backend=true
                ;;
              frontend/*)
                frontend=true
                ;;
              docs/*|*.md|*.txt)
                # Documentation-only changes need no build/test on branch push.
                ;;
              *)
                # Workflow, shared configuration, and unknown paths fail safe.
                backend=true
                frontend=true
                ;;
            esac
          done < <(git diff --name-only "$base" "$GITHUB_SHA")

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Push scope: backend=$backend, frontend=$frontend"

  demo-startup-powershell:
    name: Demo startup PowerShell regression
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Test startup guards and volume compatibility
        shell: pwsh
        run: ./scripts/tests/test-sp903-demo-startup.ps1

  backend:
    name: Backend CI
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run Maven verify
        working-directory: backend
        run: bash ./mvnw -B --no-transfer-progress verify

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/**
            backend/target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend CI
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

  container-images:
    name: Container image and Compose validation
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python for Compose and Demo credential tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test Compose merge and password-only synchronization
        run: python -m unittest scripts.tests.test_compose_config scripts.tests.test_sync_sp903_demo_credential -v

      - name: Validate Production and Demo Compose configurations
        shell: bash
        run: |
          set -euo pipefail
          prod_env="$RUNNER_TEMP/supplypilot-prod-compose.env"
          demo_env="$RUNNER_TEMP/supplypilot-demo-compose.env"
          demo_source="$RUNNER_TEMP/supplypilot-demo-source.env"
          trap 'rm -f "$prod_env" "$demo_env" "$demo_source"' EXIT
          printf '%s\n' \
            'DB_USERNAME=ci-user' \
            'DB_PASSWORD=ci-db-placeholder' \
            'MYSQL_ROOT_PASSWORD=ci-root-placeholder' \
            'SEMANTIC_DB_USERNAME=ci-semantic-user' \
            'SEMANTIC_DB_PASSWORD=ci-semantic-placeholder' \
            'JWT_SECRET=ci-jwt-placeholder' \
            > "$prod_env"
          cp "$prod_env" "$demo_env"
          printf '%s\n' 'DEMO_ACCOUNT_PASSWORD=ci-demo-placeholder' >> "$demo_env"
          printf '%s\n' "DEMO_ENV_SOURCE=$demo_source" >> "$demo_env"
          printf '%s\n' 'ci-only-placeholder' > "$demo_source"
          docker compose --env-file "$prod_env" config --quiet
          docker compose --env-file "$demo_env" -f compose.yaml -f compose.demo.yaml config --quiet

      - name: Build backend production image
        run: docker build --file backend/Dockerfile --tag supplypilot-backend:ci .

      - name: Build frontend production image
        run: docker build --file frontend/Dockerfile --build-arg VITE_API_BASE_URL=/api/v1 --tag supplypilot-frontend:ci .
