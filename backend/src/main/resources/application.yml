spring:
  application:
    name: supply-pilot-api
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
        chat:
          model: ${GEMINI_MODEL:${AI_MODEL:gemini-3.6-flash}}
          max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:512}
          temperature: 0.0
          google-search-retrieval: false
    tools:
      throw-exception-on-error: true
      resolution:
        fallback:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

supplypilot:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  frontend-origin: ${FRONTEND_ORIGIN:}
  ai:
    provider-timeout: ${AI_PROVIDER_TIMEOUT:15s}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:512}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:4}
    max-model-calls: ${AI_MAX_MODEL_CALLS:5}
  document-storage:
    type: ${DOCUMENT_STORAGE_TYPE:local}
    path: ${DOCUMENT_STORAGE_PATH:./data/documents}
  aws:
    region: ${AWS_REGION:}
    s3-bucket: ${AWS_S3_BUCKET:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  demo-data-enabled: false

