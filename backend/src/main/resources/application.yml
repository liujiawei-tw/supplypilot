spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
  application:
    name: supply-pilot-api
  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:none}
      embedding:
        text: ${AI_EMBEDDING_PROVIDER:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
        chat:
          model: ${GEMINI_MODEL:${AI_MODEL:gemini-3.6-flash}}
          max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:512}
          temperature: 0.0
          google-search-retrieval: false
        embedding:
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${SEMANTIC_DIMENSIONS:768}
            auto-truncate: false
    tools:
      throw-exception-on-error: true
      resolution:
        fallback:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

supplypilot:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  frontend-origin: ${FRONTEND_ORIGIN:}
  ai:
    provider-timeout: ${AI_PROVIDER_TIMEOUT:15s}
    draft-proposal-ttl: ${AI_DRAFT_PROPOSAL_TTL:PT10M}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:512}
    max-tool-calls: ${AI_MAX_TOOL_CALLS:4}
    max-model-calls: ${AI_MAX_MODEL_CALLS:5}
    monthly-token-warning-enabled: ${AI_MONTHLY_TOKEN_WARNING_ENABLED:false}
    monthly-token-warning-threshold: ${AI_MONTHLY_TOKEN_WARNING_THRESHOLD:1000000}
  agentic:
    sql:
      enabled: ${AGENTIC_SQL_ENABLED:false}
      question-timeout: ${AGENTIC_SQL_QUESTION_TIMEOUT:PT90S}
      provider-timeout: ${AGENTIC_SQL_PROVIDER_TIMEOUT:PT30S}
      statement-timeout: ${AGENTIC_SQL_STATEMENT_TIMEOUT:PT15S}
      max-tool-calls: ${AGENTIC_SQL_MAX_TOOL_CALLS:10}
      max-model-calls: ${AGENTIC_SQL_MAX_MODEL_CALLS:12}
      max-rows: ${AGENTIC_SQL_MAX_ROWS:100}
      max-columns: ${AGENTIC_SQL_MAX_COLUMNS:32}
      max-result-chars: ${AGENTIC_SQL_MAX_RESULT_CHARS:12000}
      max-output-tokens: ${AGENTIC_SQL_MAX_OUTPUT_TOKENS:2048}
      mysql:
        jdbc-url: ${AGENTIC_MYSQL_JDBC_URL:}
        username: ${AGENTIC_MYSQL_USERNAME:}
        password: ${AGENTIC_MYSQL_PASSWORD:}
      postgres:
        jdbc-url: ${AGENTIC_POSTGRES_JDBC_URL:}
        username: ${AGENTIC_POSTGRES_USERNAME:}
        password: ${AGENTIC_POSTGRES_PASSWORD:}
  semantic:
    jdbc-url: ${SEMANTIC_DB_URL:}
    username: ${SEMANTIC_DB_USERNAME:}
    password: ${SEMANTIC_DB_PASSWORD:}
    model-id: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    dimensions: ${SEMANTIC_DIMENSIONS:768}
    generation-key: ${SEMANTIC_GENERATION_KEY:gemini-embedding-001-768-v1}
    read-enabled: ${SEMANTIC_READ_ENABLED:false}
    top-k: ${SEMANTIC_TOP_K:5}
    similarity-threshold: ${SEMANTIC_SIMILARITY_THRESHOLD:0.45}
    embedding-timeout: ${SEMANTIC_EMBEDDING_TIMEOUT:15s}
    indexing:
      worker-enabled: ${SEMANTIC_INDEX_WORKER_ENABLED:true}
      poll-interval-millis: ${SEMANTIC_INDEX_POLL_INTERVAL_MILLIS:1000}
      lease-duration: ${SEMANTIC_INDEX_LEASE_DURATION:PT5M}
      max-attempts: ${SEMANTIC_INDEX_MAX_ATTEMPTS:4}
      initial-retry-delay: ${SEMANTIC_INDEX_INITIAL_RETRY_DELAY:PT2S}
      max-retry-delay: ${SEMANTIC_INDEX_MAX_RETRY_DELAY:PT1M}
  document-storage:
    type: ${DOCUMENT_STORAGE_TYPE:local}
    path: ${DOCUMENT_STORAGE_PATH:./data/documents}
  aws:
    region: ${AWS_REGION:}
    s3-bucket: ${AWS_S3_BUCKET:}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  demo-data-enabled: false
