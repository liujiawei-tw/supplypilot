spring:
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

supplypilot:
  demo-data-enabled: true
  demo:
    verifier-url: ${DEMO_VERIFIER_URL:https://host.docker.internal:18443/v1/verify}
    verifier-client-cert: ${DEMO_VERIFIER_CLIENT_CERT:/run/supplypilot-demo-verifier/client.crt}
    verifier-client-key: ${DEMO_VERIFIER_CLIENT_KEY:/run/supplypilot-demo-verifier/client.key}
    verifier-ca: ${DEMO_VERIFIER_CA:/run/supplypilot-demo-verifier/ca.crt}
    baseline-date: ${DEMO_BASELINE_DATE:}
    dataset-version: ${DEMO_DATASET_VERSION:sp-905-zh-tw-v1}
    samples-path: ${DEMO_SAMPLES_PATH:../samples/documents}
    reset-confirmation: ${DEMO_RESET_CONFIRMATION:}
    allowed-database: ${DEMO_ALLOWED_DATABASE:supplypilot_demo}
    allowed-semantic-database: ${DEMO_ALLOWED_SEMANTIC_DATABASE:supplypilot_semantic_demo}
  document-storage:
    type: ${DOCUMENT_STORAGE_TYPE:local}
    path: ${DOCUMENT_STORAGE_PATH:./data/demo-documents}

