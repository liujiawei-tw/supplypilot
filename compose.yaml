services:
  mysql:
    image: mysql:8.4.11
    container_name: supplypilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-supplypilot}
      MYSQL_USER: ${DB_USERNAME:-supplypilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - supplypilot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  supplypilot-mysql-data:

