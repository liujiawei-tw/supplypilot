name: supplypilot-prod

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PRODUCTION_MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_DATABASE: supplypilot_prod
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [mysql-host, data]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    mem_limit: 1g

  pgvector:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: supplypilot_semantic_prod
      POSTGRES_USER: ${SEMANTIC_DB_USERNAME:?Set SEMANTIC_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${SEMANTIC_DB_PASSWORD:?Set SEMANTIC_DB_PASSWORD in .env}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    mem_limit: 1g

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/supplypilot_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://127.0.0.1:8080}
      AI_CHAT_PROVIDER: ${AI_CHAT_PROVIDER:-none}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-${AI_API_KEY:-}}
      GEMINI_MODEL: ${GEMINI_MODEL:-${AI_MODEL:-gemini-3.6-flash}}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      SEMANTIC_DB_URL: jdbc:postgresql://pgvector:5432/supplypilot_semantic_prod
      SEMANTIC_DB_USERNAME: ${SEMANTIC_DB_USERNAME:?Set SEMANTIC_DB_USERNAME in .env}
      SEMANTIC_DB_PASSWORD: ${SEMANTIC_DB_PASSWORD:?Set SEMANTIC_DB_PASSWORD in .env}
      SEMANTIC_DIMENSIONS: ${SEMANTIC_DIMENSIONS:-768}
      SEMANTIC_GENERATION_KEY: ${SEMANTIC_GENERATION_KEY:-gemini-embedding-001-768-v1}
      SEMANTIC_READ_ENABLED: ${SEMANTIC_READ_ENABLED:-false}
      DOCUMENT_STORAGE_TYPE: local
      DOCUMENT_STORAGE_PATH: /app/data/documents
      AI_PROVIDER_TIMEOUT: ${AI_PROVIDER_TIMEOUT:-15s}
      AI_MONTHLY_TOKEN_WARNING_ENABLED: ${AI_MONTHLY_TOKEN_WARNING_ENABLED:-false}
    volumes:
      - document-storage:/app/data/documents
    networks: [data, web]
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    mem_limit: 1g

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    networks: [web]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    mem_limit: 256m

networks:
  data:
    internal: true
  mysql-host:
    driver: bridge
  web:

volumes:
  mysql-data:
  pgvector-data:
  document-storage:
